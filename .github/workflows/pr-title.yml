# PRs are squash-merged with the PR title as the commit message, and release-please reads those commits.
# So PR titles must be Conventional Commits, e.g. "feat: support trophy frogs", "fix: ignore guild chat",
# "feat!: new config format" (breaking).
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
