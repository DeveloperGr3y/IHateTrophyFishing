# Releases are driven by release-please and Conventional Commit PR titles:
#
#   1. Merge a PR titled e.g. "feat: support trophy frogs" (feat = minor, fix = patch, feat! / fix! = major).
#   2. release-please opens (or updates) a "chore(main): release x.y.z" PR with the changelog and version bump.
#   3. Merging that PR creates the tag + GitHub release; the publish job then builds every Minecraft version
#      and attaches the jars (GitHub adds the source code archives itself).
name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Optional: a token in RELEASE_PLEASE_TOKEN lets CI run on release PRs automatically.
          # Without it, PRs made by the default token don't trigger other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      MOD_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build all Minecraft versions
        run: |
          chmod +x gradlew
          ./gradlew build -Pmod_version="$MOD_VERSION" --stacktrace

      - name: Add supported versions to the release notes
        run: |
          prop() { grep "^$1=" "$2" | cut -d= -f2- | tr -d '\r'; }
          loader=$(prop loader_version gradle.properties)
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            echo
            echo "## Downloads"
            echo
            echo "| Minecraft | Jar | Fabric API |"
            echo "|---|---|---|"
            for dir in versions/*/; do
              v=$(basename "$dir")
              props="$dir/gradle.properties"
              echo "| $(prop minecraft_range "$props" | sed 's/^~//').x | \`IHateTrophyFishing-$MOD_VERSION+mc$v.jar\` | $(prop fabric_api_version "$props") or newer |"
            done
            echo
            echo "Needs Fabric Loader $loader+, Fabric API and Java 25. Kotlin and MoulConfig are bundled; no other mods needed."
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Attach jars
        run: gh release upload "$TAG" build/libs/*.jar --clobber
